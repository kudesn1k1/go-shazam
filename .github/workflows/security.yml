name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '18 9 * * 1'   # Mon 09:18 UTC — same cadence as codeql.yml

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    name: govulncheck (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: server/go.sum
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: scan
        run: |
          cd server
          govulncheck ./...

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'        # informational — don't fail on noise
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy'

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: audit
        run: |
          cd client
          npm audit --audit-level=high
        continue-on-error: true   # advisory — don't block on transitive issues
