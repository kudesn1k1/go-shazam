name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-unit:
    name: Go unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: server/go.sum
      - name: go test
        run: |
          cd server
          go test ./...

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to v1.x — our .golangci.yml uses v1 config format.
          # v2.x requires a config-format migration, deferred until needed.
          version: v1.64.8
          working-directory: server

  vue-typecheck:
    name: Vue typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: install + typecheck
        run: |
          cd client
          npm ci
          npm run typecheck

  vue-unit:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: install + test
        run: |
          cd client
          npm ci
          npm run test:unit
