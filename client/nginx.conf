server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Static assets — Vite-hashed files, served directly with long cache.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Common static files (favicon, vite.svg, etc.)
    location = /favicon.ico { try_files $uri =404; expires 1d; }
    location = /vite.svg    { try_files $uri =404; expires 1d; }

    # SEO files come from the Go server (sitemap is data-driven; robots is
    # generated alongside it for consistency).
    location = /sitemap.xml { proxy_pass http://server:5000; }
    location = /robots.txt  { proxy_pass http://server:5000; }

    # API stays on the Go server. WebSocket headers are required for the
    # recognition endpoint (/api/recognize/ws) to upgrade.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Everything else is an HTML route. The Go server templates index.html
    # with per-route SEO meta (title, description, OG, canonical, JSON-LD)
    # before serving it, then the SPA hydrates on top.
    location / {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
